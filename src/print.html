<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-коды для печати</title>
<!--BOOT-->
<style>
  @page { size: A4 portrait; margin: 12mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #111; background: #e9ecf3; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar { background: #0b1133; color: #fff; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .bar button { font: inherit; font-weight: 800; padding: 9px 18px; border: 0; border-radius: 10px; background: #ffcc40; cursor: pointer; }
  .bar p { font-size: 13px; opacity: .8; max-width: 760px; }
  .page { width: 186mm; height: 270mm; margin: 14px auto; background: #fff; border-radius: 6px; display: flex; flex-direction: column; align-items: center; padding: 12mm 10mm; text-align: center; page-break-after: always; break-after: page; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .tag { color: #fff; font-weight: 900; font-size: 30pt; padding: 4mm 12mm; border-radius: 6mm; letter-spacing: .03em; text-transform: uppercase; }
  h1 { font-size: 26pt; font-weight: 900; margin-top: 8mm; }
  .q { font-size: 14pt; margin-top: 3mm; color: #333; }
  .qr { margin-top: 8mm; padding: 4mm; border-radius: 6mm; border: 3mm solid; }
  .qr img { display: block; width: 115mm; height: 115mm; }
  .steps { margin-top: 8mm; font-size: 15pt; font-weight: 700; text-align: left; list-style: none; }
  .steps li { margin: 2.5mm 0; display: flex; align-items: center; }
  .steps b { width: 9mm; height: 9mm; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; margin-right: 4mm; flex: none; }
  .url { margin-top: auto; font: 11pt ui-monospace, Menlo, Consolas, monospace; color: #555; word-break: break-all; }
  @media print { body { background: #fff; } .bar { display: none; } .page { margin: 0; border-radius: 0; } }
</style>
</head>
<body>
<div class="bar">
  <p id="warn"></p>
  <button onclick="window.print()">🖨 Печать</button>
</div>
<div id="pages"></div>
<script src="{{ROOT}}assets/qrcode.js"></script>
<script src="{{ROOT}}assets/config.js"></script>
<script src="{{ROOT}}assets/api.js"></script>
<script src="{{ROOT}}assets/live.js"></script>
<script>
API.state().then(function (s) {
  var box = document.getElementById('pages');
  document.getElementById('warn').textContent = 'Адрес постоянный — QR можно печатать заранее. Проверьте: наведите камеру телефона на QR.';
  s.order.forEach(function (t) {
    var info = s.teams[t];
    var p = document.createElement('div');
    p.className = 'page';
    p.innerHTML = '<div class="tag" style="background:' + info.color + '"></div><h1></h1><div class="q"></div>' +
      '<div class="qr" style="border-color:' + info.color + '"><img alt="QR"></div>' +
      '<ol class="steps"><li><b>1</b>Наведи камеру телефона на QR-код</li><li><b>2</b>Отметь ' + s.picks + ' ценностей из ' + s.values.length +
      '</li><li><b>3</b>Нажми «Отправить голос» и смотри на экран!</li></ol><div class="url"></div>';
    p.querySelector('.tag').textContent = info.name;
    p.querySelector('h1').textContent = s.title;
    p.querySelector('.q').textContent = s.question;
    p.querySelector('img').src = SV.qrDataUrl(info.voteUrl);
    p.querySelectorAll('.steps b').forEach(function (b) { b.style.background = info.color; });
    p.querySelector('.url').textContent = info.voteUrl;
    box.appendChild(p);
  });
}).catch(function () { document.getElementById('warn').textContent = 'Нет связи с базой — обновите страницу.'; });
</script>
</body>
</html>
